<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json">
<title>MSP Notification Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#111;font-family:system-ui,-apple-system,sans-serif;padding:18px}
.card{max-width:520px;margin:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #0001}
h1{margin:0;font-size:25px}.sub{color:#6b7280;margin:5px 0 20px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #d9dce1;border-radius:12px;padding:13px;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;margin-top:20px;border:0;border-radius:13px;padding:15px;background:#111;color:#fff;font-size:16px;font-weight:800}
.preview{margin-top:20px;padding:16px;border-radius:16px;background:#f6f7f8}.preview b{font-size:13px;color:#666}.pbody{white-space:pre-line;margin-top:8px;font-weight:600}
.small{font-size:12px;color:#777;margin-top:12px;line-height:1.45}
</style></head><body>
<div class="card">
<h1>MSP Notification Preview</h1><div class="sub">Create and send an MSP notification to this phone.</div>
<label>Signal</label><select id="signal"><option>BUY</option><option>SELL</option><option>CUSTOM</option></select>
<div class="row"><div><label>Symbol</label><input id="symbol" value="XAUUSD"></div><div><label>Timeframe</label><input id="tf" value="1H"></div></div>
<div class="row"><div><label>Stop Loss</label><input id="sl" value="3450.72"></div><div><label>Take Profit</label><input id="tp" value="3462.72"></div></div>
<div class="row"><div><label>Lot Size</label><input id="lot" value="0.50"></div><div><label>Timing</label><select id="timing"><option>Now</option><option>5 minutes before</option><option>3 minutes before</option><option>2 minutes before</option><option>1 minute before</option></select></div></div>
<label>Message</label><textarea id="msg">New candle setup detected</textarea>
<div class="preview"><b>NOTIFICATION PREVIEW</b><div id="preview" class="pbody"></div></div>
<button id="enable">🔔 ENABLE NOTIFICATIONS</button>
<button id="send">SEND NOTIFICATION</button>
<div class="small">This is a notification preview tool for demonstrating the MSP notification format. It does not connect to TradingView or generate trading signals.</div>
</div>
<script>
let reg;
async function setup(){
 if("serviceWorker" in navigator) reg=await navigator.serviceWorker.register("sw.js");
}
function body(){
 const s=signal.value, icon=s==="BUY"?"🟢":s==="SELL"?"🔴":"🔔";
 return `${icon} ${s} SIGNAL — ${symbol.value} • ${tf.value}\nSL: ${sl.value}\nTP: ${tp.value}\nLot Size: ${lot.value}\n⏱️ ${timing.value}\n${msg.value}`;
}
function refresh(){preview.textContent=body()}
document.querySelectorAll("input,select,textarea").forEach(e=>e.addEventListener("input",refresh));
enable.onclick=async()=>{
 if(!("Notification" in window)){alert("This browser does not support notifications.");return}
 const p=await Notification.requestPermission();
 if(p==="granted"){alert("Notifications enabled. Press SEND NOTIFICATION.");}
 else alert("Notification permission was not granted. Enable notifications for MSP in Android/browser settings.");
};
send.onclick=async()=>{
 if(!reg) reg=await navigator.serviceWorker.ready;
 if(Notification.permission!=="granted"){
   const p=await Notification.requestPermission();
   if(p!=="granted") return;
 }
 const s=signal.value, icon=s==="BUY"?"🟢":s==="SELL"?"🔴":"🔔";
 await reg.showNotification("MSP — Market Signal Pro",{
  body:`${icon} ${s} SIGNAL — ${symbol.value} • ${tf.value}\nSL: ${sl.value}\nTP: ${tp.value}\nLot Size: ${lot.value}\n⏱️ ${timing.value}`,
  tag:"msp-"+Date.now(),
  renotify:true,
  vibrate:[150,80,150],
  data:{detail:`SL: ${sl.value}\nTP: ${tp.value}\nLot Size: ${lot.value}\n${timing.value}\n${msg.value}`}
 });
};
setup();refresh();
</script></body></html>
